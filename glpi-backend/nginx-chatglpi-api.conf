    # Backend do plugin GLPI nativo (chatglpi-backend.service, porta 4001) -
    # caminho separado do /api/ antigo (que é o app standalone, porta 4000).
    # Vai no MESMO vhost/porta 443 já liberada no firewall de rede pros PCs
    # clientes (a porta 4001 direta foi bloqueada - só o servidor do GLPI
    # conseguia chegar nela, os PCs dos técnicos não).
    location /chatglpi-api/stream {
        proxy_pass http://127.0.0.1:4001/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1d;
    }

    location /chatglpi-api/ {
        proxy_pass http://127.0.0.1:4001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
